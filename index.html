<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIPLAB — Streetwear Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Bungee&family=Inter:wght@400;500;600;700&family=Pacifico&family=Permanent+Marker&family=Press+Start+2P&family=Rubik+Mono+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">DRIP<span>LAB</span></div>
  <input id="designName" class="design-name" value="Untitled drop" aria-label="Design name" spellcheck="false">
  <div class="view-tabs" id="viewTabs" role="tablist"></div>
  <div class="top-actions">
    <button id="undoBtn" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redoBtn" class="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="clearBtn" class="btn ghost" title="Clear this side">Clear</button>
    <button id="newBtn" class="btn ghost">New</button>
    <button id="galleryBtn" class="btn ghost">My designs</button>
    <button id="saveBtn" class="btn">Save</button>
    <button id="view3dBtn" class="btn btn-3d" title="See it on a real 3D product, 360°">360° view</button>
    <div class="menu-wrap">
      <button id="exportBtn" class="btn primary">Export ▾</button>
      <div class="menu" id="exportMenu" hidden>
        <button data-export="mockup">Mockup PNG — this side</button>
        <button data-export="all">Mockup PNG — all sides</button>
        <button data-export="print">Print file — artwork only</button>
        <button data-export="pack">Product pack (.zip) — 3D file, renders, print files</button>
      </div>
    </div>
  </div>
</header>

<main class="app">
  <nav class="toolbar" id="toolbar" aria-label="Tools">
    <button data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg><span>Move</span></button>
    <button data-tool="brush" title="Brush (B)"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 5-2 5-4.5S7 13 5.5 14 4 18 4 20z"/><path d="M9 15L19 5l2 2-10 10"/></svg><span>Brush</span></button>
    <button data-tool="spray" title="Spray paint (S)"><svg viewBox="0 0 24 24"><path d="M7 10h7v11H7z"/><path d="M9 10V7h3v3"/><path d="M17 5h.01M20 4h.01M19 8h.01M21 7h.01M18 11h.01"/></svg><span>Spray</span></button>
    <button data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M4 16l9-9 6 6-7 7H8z"/><path d="M12 20h8"/></svg><span>Erase</span></button>
    <button data-tool="fill" title="Fill bucket (G)"><svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z"/></svg><span>Fill</span></button>
    <button data-tool="line" title="Line (L) — Shift snaps 45°"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><span>Line</span></button>
    <button data-tool="rect" title="Rectangle (R) — Shift for square"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span>Rect</span></button>
    <button data-tool="ellipse" title="Ellipse (O) — Shift for circle"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span>Ellipse</span></button>
    <button data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3"/><path d="M12 4v16"/><path d="M9 20h6"/></svg><span>Text</span></button>
    <button data-tool="picker" title="Color picker (I)"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-2 2-6-6z"/><path d="M13 7l-8 8v4h4l8-8"/></svg><span>Pick</span></button>
    <div class="tool-sep"></div>
    <button id="addImageBtn" title="Add image / logo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Image</span></button>
    <button id="mirrorBtn" class="toggle" title="Mirror drawing (M)"><svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M8 7l-4 5 4 5z"/><path d="M16 7l4 5-4 5z"/></svg><span>Mirror</span></button>
  </nav>

  <section class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" aria-label="Design canvas"></canvas>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <aside class="panel" id="panel">
    <section class="card">
      <h3>Product</h3>
      <div class="product-grid" id="productGrid"></div>
      <label class="check" id="removeBgRow" hidden><input type="checkbox" id="removeBg" checked> Remove white background</label>
    </section>

    <section class="card" id="garmentCard">
      <h3>Garment color</h3>
      <div class="swatches" id="garmentSwatches"></div>
    </section>

    <section class="card" id="objectCard" hidden>
      <h3 id="objectTitle">Selected</h3>
      <div id="textProps">
        <input id="textInput" class="text-input" placeholder="Your text" maxlength="80">
        <label class="field">Font
          <select id="fontSelect">
            <option value="Anton">Anton</option>
            <option value="Bebas Neue">Bebas Neue</option>
            <option value="Bungee">Bungee</option>
            <option value="Rubik Mono One">Rubik Mono One</option>
            <option value="Permanent Marker">Permanent Marker</option>
            <option value="UnifrakturMaguntia">Gothic</option>
            <option value="Pacifico">Pacifico</option>
            <option value="Press Start 2P">Pixel</option>
            <option value="Inter">Inter</option>
          </select>
        </label>
        <div class="row">
          <label class="field">Fill <input type="color" id="textColor"></label>
          <label class="field">Outline <input type="color" id="textStroke"></label>
        </div>
        <label class="field">Outline width <span class="val" id="textStrokeWVal"></span><input type="range" id="textStrokeW" min="0" max="20" step="1"></label>
        <label class="field">Arc <span class="val" id="textArcVal"></span><input type="range" id="textArc" min="-180" max="180" step="5"></label>
        <label class="field">Letter spacing <span class="val" id="textSpacingVal"></span><input type="range" id="textSpacing" min="-10" max="40" step="1"></label>
      </div>
      <label class="field">Opacity <span class="val" id="objOpacityVal"></span><input type="range" id="objOpacity" min="5" max="100" step="1"></label>
      <div class="btn-grid">
        <button class="btn ghost sm" data-obj="forward">Bring forward</button>
        <button class="btn ghost sm" data-obj="backward">Send back</button>
        <button class="btn ghost sm" data-obj="flip">Flip</button>
        <button class="btn ghost sm" data-obj="center">Center</button>
        <button class="btn ghost sm" data-obj="duplicate">Duplicate</button>
        <button class="btn danger sm" data-obj="delete">Delete</button>
      </div>
    </section>

    <section class="card">
      <h3>Paint</h3>
      <div class="swatches small" id="paintSwatches"></div>
      <div class="row">
        <label class="field grow">Color <input type="color" id="paintColor" value="#111111"></label>
      </div>
      <label class="field">Size <span class="val" id="sizeVal"></span><input type="range" id="size" min="1" max="120" value="14"></label>
      <label class="field">Opacity <span class="val" id="opacityVal"></span><input type="range" id="opacity" min="5" max="100" value="100"></label>
      <label class="check"><input type="checkbox" id="fillShapes"> Filled shapes</label>
      <label class="check"><input type="checkbox" id="clipToggle" checked> Keep artwork inside product</label>
    </section>

    <section class="card">
      <h3>Stickers</h3>
      <div class="sticker-grid" id="stickerGrid"></div>
    </section>
  </aside>
</main>

<dialog id="gallery" class="gallery">
  <div class="gallery-head">
    <h2>My designs</h2>
    <button class="icon-btn" id="closeGallery" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>
</dialog>

<div class="v3d" id="v3d" hidden>
  <header class="v3d-bar">
    <button class="btn ghost" id="v3dClose">← Back to editor</button>
    <div class="v3d-products" id="v3dProducts">
      <button class="chip" data-model="tee">T-Shirt</button>
      <button class="chip" data-model="crewneck">Crewneck</button>
      <button class="chip" data-model="sneaker">Sneaker</button>
      <button class="chip" data-model="glb" title="Load a real 3D model of any product (.glb)">Your 3D model (.glb)</button>
    </div>
    <div class="v3d-actions">
      <button class="btn" id="v3dUpload">Upload drawing</button>
      <button class="btn" id="v3dShot">Screenshot</button>
      <button class="btn" id="v3dGlb" title="Your designed product as a 3D file">Download 3D file</button>
      <button class="btn" id="v3dPack" title="3D file, renders, print files and mockups in one zip">Download all (.zip)</button>
      <button class="btn primary" id="v3dRecord">Record 360° video</button>
    </div>
  </header>
  <div class="v3d-stage" id="v3dStage">
    <canvas id="v3dCanvas"></canvas>
    <div class="v3d-status" id="v3dStatus" hidden></div>
    <div class="v3d-empty" id="v3dEmpty" hidden>Nothing printed yet — <strong>Upload drawing</strong>, drop an image here, or draw in the editor.</div>
    <div class="v3d-note" id="v3dNote" hidden></div>
    <div class="v3d-bottom">
      <div class="v3d-colors" id="v3dColors"></div>
      <div class="v3d-angles" id="v3dAngles">
        <button class="chip active" id="v3dSpin">⟳ Spin</button>
        <button class="chip" data-angle="0">Front</button>
        <button class="chip" data-angle="-90">Left</button>
        <button class="chip" data-angle="180">Back</button>
        <button class="chip" data-angle="90">Right</button>
      </div>
      <p class="v3d-help">Drag to rotate · scroll / pinch to zoom</p>
      <p class="v3d-credit">Sneaker model: “Materials Variants Shoe” © Shopify, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (resized textures)</p>
    </div>
  </div>
  <input type="file" id="v3dDrawFile" accept="image/*" hidden>
  <input type="file" id="v3dGlbFile" accept=".glb,model/gltf-binary" hidden>
</div>

<dialog id="confirmDlg" class="confirm">
  <p id="confirmMsg"></p>
  <div class="confirm-actions">
    <button class="btn ghost" id="confirmCancel">Cancel</button>
    <button class="btn primary" id="confirmOk">OK</button>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>

<input type="file" id="imageFile" accept="image/*" hidden>
<input type="file" id="productFile" accept="image/*" hidden>

<script src="products-baked.js"></script>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
